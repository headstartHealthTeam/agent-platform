name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm qa

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level moderate
      - run: pnpm audit --audit-level moderate

  required:
    name: Required
    if: ${{ always() }}
    needs: [quality, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require every mandatory lane to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
        run: |
          if [ "$QUALITY_RESULT" != success ] || [ "$AUDIT_RESULT" != success ]; then
            printf '%s\n' "Quality: $QUALITY_RESULT; dependency audit: $AUDIT_RESULT"
            exit 1
          fi
