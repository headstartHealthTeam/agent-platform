version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-toolchain:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # These releases require newer Node patches than the current workstation baseline.
      # Reassess with an explicit Node baseline update; retain other Corepack updates.
      - dependency-name: corepack
        versions:
          - '0.35.x'
          - '0.36.x'
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
